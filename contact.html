<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <table border="1" cellpadding="8">
        <form action="">
            <tr>
                <th>Field</th>
                <th>Information</th>
            </tr>

            <tr>
                <td>
                    <label for="name">Name:</label>
                </td>
                <td>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email">Email:</label>
                </td>
                <td>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="phone">Phone:</label>
                </td>
                <td>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="subject">Subject:</label>
                </td>
                <td>
                    <input type="text" id="subject" name="subject" placeholder="Enter subject" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="message">Message:</label>
                </td>
                <td>
                    <textarea id="message" name="message" rows="5" cols="30" placeholder="Write your message here..."
                        required></textarea>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Gender:</label>
                </td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="food">Food Preference:</label>
                </td>
                <td>
                    <select id="food" name="food">
                        <option value="">Select Food Preference</option>
                        <option value="Pakistani">Pakistani Food</option>
                        <option value="Chinese">Chinese Food</option>
                        <option value="Italian">Italian Food</option>
                        <option value="Fast Food">Fast Food</option>
                        <option value="Vegetarian">Vegetarian Food</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Submit:</label>
                </td>
                <td>
                    <button type="submit">Submit Form </button>
                </td>
            </tr>

    </table>

    </form>

    <hr>

    <footer>
        <h3>Food Haven Restaurant</h3>

        <p>
            Main Food Street, Karachi, Pakistan

            <br>
            Email: info@foodhaven.com
        </p>

         <font color="#102C32">GO BACK</font>>

        </a>
        </head>
</body>

</html>
